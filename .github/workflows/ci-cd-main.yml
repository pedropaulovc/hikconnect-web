name: CI/CD Main

permissions:
  contents: read
  checks: read

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "24.15.0"

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  coverage-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: for i in 1 2 3; do npm ci && break || sleep 15; done
      - name: Run unit tests with coverage
        run: npm run test:coverage
      - name: Upload coverage baseline
        uses: actions/upload-artifact@v7
        with:
          name: coverage-baseline
          path: coverage/coverage-summary.json
          retention-days: 90

  wait-for-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare production build
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          SHA="${{ github.sha }}"
          echo "Waiting for Cloudflare Workers build for SHA: ${SHA:0:7}"
          for i in $(seq 1 60); do
            RUN=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("Workers Builds"))] | sort_by(.started_at) | last' 2>/dev/null)
            STATUS=$(echo "$RUN" | jq -r '.status // empty' 2>/dev/null)
            if [ "$STATUS" = "completed" ]; then
              CONCLUSION=$(echo "$RUN" | jq -r '.conclusion // empty')
              if [ "$CONCLUSION" != "success" ]; then
                echo "::error::Production build did not succeed: ${CONCLUSION:-unknown}"
                exit 1
              fi
              echo "✅ Production build succeeded"
              exit 0
            fi
            echo "Workers build status: ${STATUS:-pending} (attempt $i/60)"
            sleep 5
          done
          echo "::error::Timeout waiting for Cloudflare Workers build"
          exit 1
