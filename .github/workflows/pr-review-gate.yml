name: Human review gate

# Solo-dev review gate. The job targets the `pr-review-gate` environment, which
# has a required reviewer. GitHub holds the job as a pending deployment until the
# reviewer approves it in the PR's checks/Environments UI. The "Protect main"
# ruleset's required_deployments rule keeps merge (incl. auto-merge) blocked
# until that approval lands — this is the GitHub-sanctioned way for a solo
# maintainer to gate their own PRs (PR self-approval is blocked, deployment
# self-approval is not).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  gate:
    name: Awaiting human review
    runs-on: ubuntu-latest
    environment: pr-review-gate
    steps:
      - run: echo "Human approver acknowledged this PR's diff."
